<!doctype html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Portfoli · Un passeig pel bosc</title>
  <meta name="description" content="Portfoli interactiu: passeja pel bosc i fotografia els animals per descobrir qui sóc." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cpath fill=%27%234f6f2f%27 d=%27M16 2 5 18h6l-4 7h7v5h4v-5h7l-4-7h6z%27/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <canvas id="scene"></canvas>

  <!-- Canvi d'idioma (també amb la tecla F) -->
  <button id="lang" class="lang-switch" type="button">
    <span class="lang-opts"><span data-lang="ca">CA</span><i></i><span data-lang="en">EN</span></span>
    <span class="lang-hint"></span>
  </button>

  <!-- Només mentre es carrega; després s'esvaeix sola -->
  <div id="loader"><div class="loader-inner"><p>Carregant el bosc…</p><div class="progress"><span id="progress-bar"></span></div></div></div>

  <!-- La càmera que puja -->
  <div id="raise-cam" aria-hidden="true">
    <svg viewBox="0 0 400 240">
      <rect x="10" y="40" width="380" height="190" rx="26" fill="#1f1d1b"/>
      <rect x="140" y="12" width="120" height="44" rx="10" fill="#1f1d1b"/>
      <rect x="160" y="20" width="80" height="26" rx="6" fill="#0c0c0c"/>
      <rect x="40" y="70" width="210" height="140" rx="10" fill="#0e1612"/>
      <rect x="40" y="70" width="210" height="140" rx="10" fill="url(#lcd)"/>
      <circle cx="310" cy="110" r="26" fill="#2b2926" stroke="#3a3733" stroke-width="4"/>
      <circle cx="310" cy="110" r="8" fill="#3d3a36"/>
      <rect x="285" y="160" width="50" height="10" rx="5" fill="#3a3733"/>
      <rect x="285" y="180" width="50" height="10" rx="5" fill="#3a3733"/>
      <circle cx="360" cy="60" r="10" fill="#c8452d"/>
      <defs><linearGradient id="lcd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a6a52" stop-opacity=".55"/><stop offset=".5" stop-color="#1b2a20" stop-opacity=".2"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient></defs>
    </svg>
  </div>

  <!-- Visor -->
  <div id="viewfinder" aria-hidden="true">
    <div class="vf-vignette"></div>
    <div class="vf-grid"></div>
    <div class="vf-corner tl"></div><div class="vf-corner tr"></div><div class="vf-corner bl"></div><div class="vf-corner br"></div>
    <div class="vf-focus"><i></i><i></i><i></i><i></i></div>
    <div class="vf-top"><span class="rec"></span><span id="vf-species">CÉRVOL</span><span id="vf-count">1/4</span></div>
    <div class="vf-bottom"><span class="vf-back" id="vf-back">↑ scroll enrere per baixar la càmera</span><span>1/500</span><span>f/2.8</span><span>ISO 200</span><span class="vf-cta" id="vf-cta">Clic per disparar</span></div>
  </div>
  <div id="shutter"><i class="a"></i><i class="b"></i></div>
  <div id="flash"></div>

  <noscript>Aquesta web necessita JavaScript.</noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
